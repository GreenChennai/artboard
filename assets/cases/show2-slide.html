<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-slide · 青梧智联融资发布(封面页)</title>
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1280px; height:720px; overflow:hidden; background:#081410; }
:root { --c-ink:#eef7f0; --c-teal:#2ee6a8; --c-muted:#6f8a7c; }
.mesh { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(50% 70% at 24% 42%, rgba(46,230,168,.26) 0%, transparent 60%); }
.grid { position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(rgba(238,247,240,.05) 1px, transparent 1px) 0 0/ 64px 64px,
    linear-gradient(90deg, rgba(238,247,240,.05) 1px, transparent 1px) 0 0/ 64px 64px;
  -webkit-mask-image:radial-gradient(70% 80% at 35% 50%, #000 30%, transparent 100%); }
.logo { position:absolute; top:56px; left:72px; font:600 24px/1 'MiSans';
  color:var(--c-muted); letter-spacing:.4em; }
.page { position:absolute; top:56px; right:72px; font:400 18px/1 'MiSans';
  color:var(--c-muted); letter-spacing:.2em; }
.title { position:absolute; top:220px; left:72px; font:700 88px/1.2 'MiSans';
  color:var(--c-ink); letter-spacing:.04em; }
.title .teal { color:var(--c-teal); }
.sub { position:absolute; top:430px; left:72px; font:400 30px/1.7 'MiSans';
  color:var(--c-muted); letter-spacing:.08em; }
.meta { position:absolute; bottom:64px; left:72px; right:72px;
  display:flex; justify-content:space-between; border-top:2px solid rgba(238,247,240,.14);
  padding-top:24px; font:400 20px/1 'MiSans'; color:var(--c-muted); letter-spacing:.12em; }
.meta b { font-weight:600; color:var(--c-teal); }
</style></head>
<body><div class="poster">
  <div class="mesh"></div><div class="grid"></div>
  <div class="logo">青梧智联 GREENPARASOL</div>
  <div class="page">01 / 18</div>
  <div class="title">A 轮融资发布<br><span class="teal">让每个设备都被善待</span></div>

  <div class="meta">
    <span>青梧智联 · 2026 投资人沟通会</span>
    <span><b>IR</b> ir@greenparasol.io</span>
