<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Y2K 千禧派对</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: Inter, Roboto, sans-serif;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    display: grid; place-items: center;
    color: #ffffff;
  }
  .poster {
    width: 720px; padding: 56px;
    border-radius: 24px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
  }
  h1 { font-family: Inter, sans-serif; font-size: 64px; letter-spacing: -2px; line-height: 1.1; }
  h2 { font-size: 22px; font-weight: 500; margin-top: 18px; opacity: .85; }
  .card {
    margin-top: 28px; padding: 20px 24px; border-radius: 16px;
    border-left: 4px solid #a855f7;
    background: rgba(255,255,255,0.12);
  }
  .metric { font-size: 40px; font-weight: 700; }
  .meta { margin-top: 26px; font-size: 15px; opacity: .7; }
  .badge { display:inline-block; padding: 6px 14px; border-radius: 999px; background:#c4b5fd; color:#3730a3; font-size:13px; }
</style>
</head>
<body>
  <main class="poster">
    <span class="badge">🚀 全新体验</span>
    <h1>Y2K 千禧派对<br>一起回到 2000</h1>
    <h2>✨ 未来感 ✨ 潮流 ✨ 无限可能</h2>
    <section class="card">
      <div class="metric">效率提升 3 倍</div>
      <p>feature one — 待补充</p>
    </section>
    <p class="meta">2026.10.31 · 上海 · 详情待定</p>
  </main>
</body>
</html>
