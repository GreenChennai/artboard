<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-gzh · 栗食记公众号封面</title>
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:900px; height:383px; overflow:hidden;
  background:linear-gradient(120deg, #333a26 0%, #4a5232 58%, #6b7c3e 100%); }
:root { --c-cream:#f2f5e8; --c-accent:#f0c14b; }
.photo { position:absolute; right:0; top:0; bottom:0; width:330px; }
.photo img { width:100%; height:100%; object-fit:cover;
  filter:brightness(.92) saturate(1.05); }
.blend { position:absolute; right:250px; top:0; bottom:0; width:120px;
  background:linear-gradient(90deg, #333a26 0%, rgba(51,58,38,0) 100%); }
.kicker { position:absolute; top:64px; left:64px; font:600 20px/1 'MiSans';
  color:var(--c-accent); letter-spacing:.5em; }
h1 { position:absolute; top:120px; left:64px; font:700 84px/1.25 'MiSans';
  color:var(--c-cream); letter-spacing:.04em; }
h1 .y { color:var(--c-accent); }
.sub { position:absolute; top:300px; left:64px; font:400 25px/1 'MiSans';
  color:rgba(242,245,232,.78); letter-spacing:.2em; }
.footer { position:absolute; bottom:44px; left:64px; font:400 19px/1 'MiSans';
  color:rgba(242,245,232,.55); letter-spacing:.3em; }
</style></head>
<body><div class="poster">
  <div class="photo"><img src="img/breakfast.jpg" alt=""></div>
  <div class="blend"></div>
  <div class="kicker">栗食记 · 第 12 篇</div>
  <h1>早餐的 <span class="y">4 个</span> 误区</h1>
  <div class="sub">营养师门诊笔记 · 十分钟读完</div>
  <div class="footer">LISHIJI NUTRITION STUDIO</div>
</div></body></html>
