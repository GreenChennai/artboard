    <text x="64" y="246" font-family="KaiTi,'Kaiti SC','STKaiti','BiauKai',serif" font-size="36" fill="#2b4a13">「字落生根,版上开花。」</text>
    <text x="64" y="292" font-size="19" fill="#57703c">把每一句文案、每一张照片,养成印刷级的设计图。</text>

    <text x="64" y="336" font-size="16" fill="#6f8452">小红书封面 · 电商主图 · 主 KV · 数据长图 · 名片 · 三折页 · 易拉宝 · PPT 页 · GIF 动图</text>

    <g font-family="ui-monospace,'Cascadia Mono',Consolas,'Microsoft YaHei','PingFang SC','Noto Sans SC',monospace" font-size="15.5" fill="#47711f" text-anchor="middle">
      <rect x="64" y="374" width="180" height="40" rx="20" fill="#fdfff5" fill-opacity=".55" stroke="#7fae44" stroke-width="1.6"/>
