<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>trifold-case-back · 山雾茶町三折页(背面:折口背/封底/封面)</title>
<!-- 素材:materials/promo-coffee-land/promo-coffee-land-pexels-01.jpg(Pexels License / hello aesthe)
     背面画布从左到右 = 内页三背面 | 封底 | 封面(包心折,视觉阅读方向)。字体:MiSans -->
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');
  font-weight:normal; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1754px; height:1240px; overflow:hidden; }
:root { --c-ink:#241a10; --c-brown:#6d4326; --c-gold:#b98a2e; --c-amber:#e0a458; --c-muted:#8a7a62; }

/* 内页三背面:品鉴三步 */
.c1 { position:absolute; left:0; top:0; bottom:0; width:585px; background:#fff; padding:96px 60px; }
.c1 .kicker { font:600 24px/1 'MiSans'; color:var(--c-gold); letter-spacing:.4em; }
.c1 h2 { margin-top:26px; font:700 54px/1.3 'MiSans'; color:var(--c-ink); }
.step { margin-top:56px; }
.step .s { font:700 28px/1 'SmileySans'; color:var(--c-amber); letter-spacing:.14em; }
.step h3 { margin-top:16px; font:600 32px/1.3 'MiSans'; color:var(--c-ink); }
.step p { margin-top:12px; font:400 25px/1.7 'MiSans'; color:var(--c-muted); }

/* 封底:联系 + 二维码 */
.c2 { position:absolute; left:585px; top:0; bottom:0; width:584px; background:#181109;
  color:#f2e6cf; padding:96px 64px; }
.c2 .kicker { font:600 24px/1 'MiSans'; color:#c9b389; letter-spacing:.4em; }
.c2 .qr { margin-top:56px; width:300px; height:300px; background:#f2e6cf; border-radius:16px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.c2 .qr img { width:88%; height:88%; }
.c2 .addr { margin-top:60px; font:400 28px/2.0 'MiSans'; color:#d9c9a8; }
.c2 .addr b { font-weight:600; color:#f2e6cf; }
.c2 .addr .nowrap { white-space:nowrap; }
.c2 .en { margin-top:44px; font:400 20px/1 'MiSans'; color:#8a7452; letter-spacing:.26em;
  white-space:nowrap; }

/* 封面:品牌大字 + 底图 */
.c3 { position:absolute; left:1169px; top:0; bottom:0; width:585px; overflow:hidden; background:#181109; }
.c3 img { width:100%; height:100%; object-fit:cover; object-position:center 30%;
  filter:brightness(.6) saturate(.92); }
.c3 .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(24,17,9,.42), rgba(24,17,9,.24) 45%, rgba(24,17,9,.78)); }
.c3 .brand { position:absolute; left:0; right:0; bottom:0; padding:0 56px 96px; }
.c3 .mark { width:112px; height:112px; border-radius:50%; border:2px solid var(--c-amber);
  color:var(--c-amber); display:flex; align-items:center; justify-content:center;
  font:700 48px/1 'MiSans'; }
.c3 .name { margin-top:40px; font:700 88px/1.2 'MiSans'; color:#fff5ea; letter-spacing:.14em; }
.c3 .slogan { margin-top:24px; font:400 27px/1.7 'MiSans'; color:#d9c9a8; letter-spacing:.14em; }
</style></head>
<body><div class="poster">
  <div class="c1">
    <div class="kicker">TASTING</div>
    <h2>第一次来?<br>三步品鉴</h2>
    <div class="step"><div class="s">STEP 1</div><h3>闻干香</h3>
      <p>研磨后的干香是这支豆子的名片。</p></div>
    <div class="step"><div class="s">STEP 2</div><h3>啜吸</h3>
      <p>用力啜吸让咖啡雾化,风味更清楚。</p></div>
    <div class="step"><div class="s">STEP 3</div><h3>降温再喝</h3>
      <p>从 60°C 到常温,甜感会一路展开。</p></div>
  </div>
  <div class="c2">
    <div class="kicker">CONTACT</div>
    <div class="qr"><img src="img/qr.png" alt=""></div>
    <div class="addr">
      <b>山雾茶町 · 雾山路店</b><br>
      杭州市西湖区雾山路 88 号<br>
      营业时间 09:00 – 21:00<br>
      <span class="nowrap">hello@shanwu.cafe</span><br>
      <span class="nowrap">138 0000 0000</span>
    </div>
    <div class="en">EST. 2021</div>
  </div>
  <div class="c3">
    <img src="img/promo-coffee-land-pexels-01.jpg" alt="">
    <div class="veil"></div>
    <div class="brand">
      <div class="mark">雾</div>
      <div class="name">山雾茶町</div>
      <div class="slogan">山雾之间 · 一杯日常</div>
    </div>
  </div>
</div></body></html>
