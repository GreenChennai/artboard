<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-kv · 青梧智联发布</title>
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1920px; height:1080px; overflow:hidden; background:#081410; }
:root { --c-ink:#eef7f0; --c-teal:#2ee6a8; --c-muted:#6f8a7c; }
.mesh { position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(55% 60% at 28% 40%, rgba(46,230,168,.30) 0%, transparent 60%),
    radial-gradient(40% 45% at 80% 15%, rgba(46,180,230,.12) 0%, transparent 60%); }
.grid { position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(rgba(238,247,240,.05) 1px, transparent 1px) 0 0/ 96px 96px,
    linear-gradient(90deg, rgba(238,247,240,.05) 1px, transparent 1px) 0 0/ 96px 96px;
  -webkit-mask-image:radial-gradient(75% 70% at 40% 45%, #000 30%, transparent 100%); }
.topbar { position:absolute; top:64px; left:96px; right:96px;
  display:flex; justify-content:space-between; align-items:center; }
.topbar .logo { font:600 30px/1 'MiSans'; color:var(--c-muted); letter-spacing:.4em; }
.version { position:absolute; top:210px; left:96px; display:inline-flex; align-items:center;
  gap:14px; padding:12px 30px; border-radius:999px;
  background:rgba(46,230,168,.10); border:1px solid rgba(46,230,168,.45);
  box-shadow:0 0 24px rgba(46,230,168,.18); }
.version span { font:600 26px/1 'MiSans'; color:var(--c-teal); letter-spacing:.2em; }
.hero { position:absolute; top:300px; left:96px; width:1100px; }
.hero h1 { font:700 150px/1.15 'MiSans'; color:var(--c-ink); letter-spacing:.05em; }
.hero .sub { margin-top:36px; font:400 44px/1.6 'MiSans'; color:var(--c-muted); letter-spacing:.1em; }
.hero .sub b { font-weight:600; color:var(--c-ink); }
.cards { position:absolute; left:96px; right:96px; bottom:96px; display:flex; gap:40px; }
.card { flex:1; padding:38px 42px; border-radius:20px;
  background:rgba(238,247,240,.06); border:1px solid rgba(238,247,240,.14);
  backdrop-filter:blur(18px); box-shadow:0 10px 36px rgba(0,0,0,.35); }
.card h3 { font:700 32px/1 'MiSans'; color:var(--c-ink); letter-spacing:.06em; }
.card p { margin-top:16px; font:400 24px/1.6 'MiSans'; color:var(--c-muted); }
.date { position:absolute; top:80px; right:96px; text-align:right;
  font:400 24px/1.8 'MiSans'; color:var(--c-muted); letter-spacing:.15em; }
</style></head>
<body><div class="poster">
  <div class="mesh"></div><div class="grid"></div>
  <div class="topbar"><span class="logo">青梧智联 GREENPARASOL</span><span class="date">2026.10.16 · 城市峰会</span></div>
  <div class="version"><span>IoT 平台 2.0</span></div>
  <div class="hero">
    <h1>万物有梧<br>智联可栖</h1>
    <div class="sub">青梧智联 IoT 2.0 —— <b>百万设备,一屏可管</b>。</div>
  </div>
  <div class="cards">
    <div class="card"><h3>秒级接入</h3><p>新设备 3 分钟上云,协议自动适配。</p></div>
    <div class="card"><h3>边缘计算</h3><p>断网自治,数据就近处理不出场。</p></div>
    <div class="card"><h3>开放生态</h3><p>200+ 行业驱动,低代码编排联动。</p></div>
  </div>
</div></body></html>
