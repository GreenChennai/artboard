<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>multi-draft-case · 早餐的 3 个误区(B 雅 · 转正形态)</title>
<!-- multi-draft.md 参考案例:同一文案 4 个受控变体(A稳/B雅/C冲/D巧,见 docs/samples/multi-draft-sheet.png)
     中「B 雅」被用户选中后的转正形态(§6 选择即转正:选中稿提升为基线,落选稿移 _archive/)。
     受控轴:配色/气质(藏蓝 tokens)+ 去卡片编辑排版;文案与其他 3 稿逐字相同。
     自查:层级 3(标题/要点/CTA)、强调 2(kicker+数字)、特效 0、字体 2 款(达标)
     硬提示:导出前必跑 check_overflow.py;软提示:人格 = 克制/编辑/呼吸感 -->
<style>
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');
  font-weight:normal; font-display:block; }
@font-face { font-family:'SourceHanSans'; src:url('fonts/NotoSansSC-VF.ttf') format('truetype');
  font-weight:100 900; font-display:block; }

* { margin:0; padding:0; box-sizing:border-box; }
html, body { margin:0; background:#ffffff; }
:root { --c-bg:#f2ede3; --c-ink:#26241f; --c-accent:#2d4a6b; --c-muted:#97907f; --c-line:#cfc6b2; }

.poster { position:relative; width:1080px; height:1440px; overflow:hidden;
  background:var(--c-bg); font-family:'SourceHanSans',sans-serif; }

.brand { position:absolute; top:64px; left:80px; right:80px;
  display:flex; justify-content:space-between; align-items:center; }
.brand .logo { font-size:30px; font-weight:700; color:var(--c-ink); letter-spacing:.12em; }
.brand .no   { font-size:24px; color:var(--c-muted); letter-spacing:.2em; }

/* B 雅:主标居中下沉,上下大留白(呼吸位在焦点旁) */
.hero { position:absolute; left:80px; right:80px; top:330px; text-align:center; }
.hero .kick { font-size:28px; font-weight:700; color:var(--c-accent); letter-spacing:.42em; }
.hero h1 { font-family:'SmileySans','SourceHanSans',sans-serif; font-weight:400;
  font-size:96px; line-height:1.14; color:var(--c-ink); margin-top:26px; }
.hero h1 b { color:var(--c-accent); font-weight:400; }
.hero .sub { margin-top:24px; font-size:32px; line-height:1.5; color:var(--c-muted); letter-spacing:.08em; }

/* 要点:去卡片,细横线分栏(编辑排版,无容器强调) */
.pts { position:absolute; left:80px; right:80px; top:780px; display:flex;
  flex-direction:column; }
.pt { border-top:1px solid var(--c-line); padding:26px 8px 30px;
  display:flex; align-items:flex-start; gap:28px; }
.pt .n { font-family:'SmileySans','SourceHanSans',sans-serif; font-size:40px; line-height:1;
  color:var(--c-accent); min-width:56px; padding-top:8px; }
.pt h3 { font-size:38px; line-height:1.3; color:var(--c-ink); font-weight:700; }
.pt p  { margin-top:10px; font-size:28px; line-height:1.5; color:var(--c-muted); }

/* CTA:描边幽灵按钮,不与要点抢强调 */
.cta { position:absolute; left:80px; right:80px; bottom:72px; height:96px;
  border:2px solid var(--c-ink); border-radius:16px; display:flex; align-items:center;
  justify-content:center; }
.cta span { font-size:32px; font-weight:500; color:var(--c-ink); letter-spacing:.3em; }
</style>
</head>
<body>
<div class="poster">

  <div class="brand">
    <div class="logo">轻食研究所 LITE LAB</div>
    <div class="no">门诊笔记 · 12</div>
  </div>

  <div class="hero">
    <div class="kick">三分钟自查</div>
    <h1>早餐的 <b>3</b> 个误区</h1>
    <div class="sub">别再让「养生」偷走你的蛋白质</div>
  </div>

  <div class="pts">
    <div class="pt">
      <div class="n">1</div>
      <div><h3>白粥咸菜最养胃?</h3><p>缺蛋白质,换成鸡蛋 + 牛奶</p></div>
    </div>
    <div class="pt">
      <div class="n">2</div>
      <div><h3>果汁代替水果?</h3><p>纤维没了,糖分翻倍</p></div>
    </div>
    <div class="pt">
      <div class="n">3</div>
      <div><h3>边走边吃省时间?</h3><p>血糖波动,更容易胖</p></div>
    </div>
  </div>

  <div class="cta"><span>收藏这篇 · 明天早餐自查一遍</span></div>

</div>
</body>
</html>
