<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="artboard · HTML 海报工作室:九格式导出,零浏览器依赖">
  <style>
    .fg   { fill:#1f2328; }
    .mut  { fill:#57606a; }
    .dim  { fill:#8c959f; }
    .ln   { stroke:#d0d7de; }
    .chip { fill:none; stroke:#d0d7de; }
    @media (prefers-color-scheme: dark) {
      .fg   { fill:#e6edf3; }
      .mut  { fill:#9da7b3; }
      .dim  { fill:#6e7681; }
      .ln   { stroke:#30363d; }
      .chip { stroke:#30363d; }
    }
  </style>
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00c2a8"/>
    </linearGradient>
  </defs>

  <!-- 外框 + 四角裁切标记:印刷工序的极客符号 -->
  <rect x="34" y="34" width="1132" height="352" rx="14" class="ln" fill="none" stroke-width="1.2" opacity=".7"/>
  <g class="ln" stroke-width="1.6" opacity=".85">
    <path d="M34 66 V34 H66" fill="none"/>
    <path d="M1134 34 H1166 V66" fill="none"/>
    <path d="M1166 354 V386 H1134" fill="none"/>
    <path d="M66 386 H34 V354" fill="none"/>
  </g>

  <!-- 主标 -->
  <text x="92" y="150" class="fg" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif"
        font-size="64" font-weight="700" letter-spacing="1">artboard</text>
  <rect x="92" y="176" width="196" height="4" rx="2" fill="url(#acc)"/>

  <text x="92" y="228" class="mut" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif"
        font-size="22">把文案和照片写进 HTML/CSS,经 Kiln 原生引擎出图</text>
  <text x="92" y="266" class="dim" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif"
        font-size="20">文字永远锐利 · 配色永远可控 · 结果永远可复现</text>

  <!-- 九格式:3×3 章子 -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" font-size="19" text-anchor="middle">
    <g><rect x="712" y="106" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="776" y="135" class="fg">PNG</text></g>
    <g><rect x="852" y="106" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="916" y="135" class="fg">JPG</text></g>
    <g><rect x="992" y="106" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="1056" y="135" class="fg">GIF</text></g>
    <g><rect x="712" y="166" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="776" y="195" class="fg">MP4</text></g>
    <g><rect x="852" y="166" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="916" y="195" class="fg">SVG</text></g>
    <g><rect x="992" y="166" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="1056" y="195" class="fg">PDF</text></g>
    <g><rect x="712" y="226" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="776" y="255" class="fg">EPS</text></g>
    <g><rect x="852" y="226" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="916" y="255" class="fg">AI</text></g>
    <g><rect x="992" y="226" width="128" height="46" rx="8" class="chip" stroke-width="1.2"/><text x="1056" y="255" class="fg">PPTX</text></g>
  </g>
  <text x="916" y="312" class="dim" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" font-size="17">9 formats · one render</text>

  <!-- 底部刻度尺:呼应"尺寸可算" -->
  <g class="ln" stroke-width="1.2">
    <line x1="92" y1="330" x2="1108" y2="330"/>
    <line x1="92"  y1="330" x2="92"  y2="342"/>
    <line x1="346" y1="330" x2="346" y2="338"/>
    <line x1="600" y1="330" x2="600" y2="342"/>
    <line x1="854" y1="330" x2="854" y2="338"/>
    <line x1="1108" y1="330" x2="1108" y2="342"/>
  </g>
  <text x="92" y="364" class="dim" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" font-size="16">300 dpi</text>
  <text x="600" y="364" class="dim" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" font-size="16">40+ 物料尺寸 · 安全区 · 折线</text>
  <text x="1108" y="364" class="dim" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" font-size="16">v1.13</text>
</svg>
