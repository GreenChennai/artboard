<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-card · 程序律师名片(正/背)</title>
<!-- 正面+背面共用此文件族;背面见 card2-back。深藏青+金,律所气质 -->
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1063px; height:638px; overflow:hidden;
  background:linear-gradient(150deg, #0c1c33 0%, #122a4a 60%, #0c1c33 100%); }
:root { --c-ink:#eef2f8; --c-gold:#c9a85c; --c-muted:#8ea0b8; }
.frame { position:absolute; inset:22px; border:1px solid rgba(201,168,92,.45); }
.corner { position:absolute; width:26px; height:26px; border:2px solid var(--c-gold); }
.c1 { left:22px; top:22px; border-right:none; border-bottom:none; }
.c2 { right:22px; top:22px; border-left:none; border-bottom:none; }
.c3 { left:22px; bottom:22px; border-right:none; border-top:none; }
.c4 { right:22px; bottom:22px; border-left:none; border-top:none; }
.mark { position:absolute; left:80px; top:74px; width:104px; height:104px;
  border:1.5px solid var(--c-gold); color:var(--c-gold);
  display:flex; align-items:center; justify-content:center; font:600 44px/1 'MiSans'; }
.name { position:absolute; left:80px; top:236px; font:700 62px/1 'MiSans'; color:var(--c-ink); letter-spacing:.14em; }
.title { position:absolute; left:80px; top:322px; font:400 26px/1 'MiSans'; color:var(--c-muted); letter-spacing:.3em; }
.divider { position:absolute; left:80px; top:380px; width:56px; height:3px; background:var(--c-gold); }
.contact { position:absolute; left:80px; top:420px; font:400 26px/1.95 'MiSans'; color:var(--c-ink); }
.contact b { font-weight:600; color:var(--c-muted); margin-right:14px; font-size:23px; }
.firm { position:absolute; left:80px; bottom:52px; font:600 22px/1.5 'MiSans';
  color:var(--c-gold); letter-spacing:.2em; }
</style></head>
<body><div class="poster">
  <div class="frame"></div>
  <div class="corner c1"></div><div class="corner c2"></div>
  <div class="corner c3"></div><div class="corner c4"></div>
  <div class="mark">衡</div>
  <div class="name">程一序</div>
  <div class="title">合伙人 · 执业律师</div>
  <div class="divider"></div>
  <div class="contact">
    <div><b>电话</b>137 0000 0000</div>
    <div><b>邮箱</b>cheng@balance.law</div>
    <div><b>地址</b>杭州市钱江新城平衡大厦 21F</div>
  </div>
  <div class="firm">平衡律师事务所 · BALANCE LAW FIRM</div>
</div></body></html>
