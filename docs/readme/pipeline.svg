<svg width="1200" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="artboard 工作流水线:追问 → 风格字体 → 素材 → 写图 → 导出 → 机检 → 交付">
  <style>
    .box { fill:none; stroke:#d0d7de; }
    .num { fill:#8c959f; }
    .lab { fill:#1f2328; }
    .sub { fill:#8c959f; }
    .arr { stroke:#8c959f; }
    .hot { stroke:#00c2a8; }
    .hotlab { fill:#00a88f; }
    @media (prefers-color-scheme: dark) {
      .box { stroke:#30363d; }
      .num { fill:#6e7681; }
      .lab { fill:#e6edf3; }
      .sub { fill:#6e7681; }
      .arr { stroke:#6e7681; }
      .hotlab { fill:#2ee6c8; }
    }
  </style>

  <!-- 七步,单行;Step 5 是唯一带品牌色的节点(导出 = 引擎) -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" text-anchor="middle">
    <text x="86"  y="72" class="num" font-size="15">01</text>
    <rect x="24"  y="86" width="124" height="72" rx="10" class="box" stroke-width="1.2"/>
    <text x="86"  y="118" class="lab" font-size="22">追问</text>
    <text x="86"  y="143" class="sub" font-size="14">用途 尺寸 风格</text>

    <text x="252" y="72" class="num" font-size="15">02</text>
    <rect x="190" y="86" width="124" height="72" rx="10" class="box" stroke-width="1.2"/>
    <text x="252" y="118" class="lab" font-size="22">定风格</text>
    <text x="252" y="143" class="sub" font-size="14">风格 × 字体 ≤3</text>

    <text x="418" y="72" class="num" font-size="15">03</text>
    <rect x="356" y="86" width="124" height="72" rx="10" class="box" stroke-width="1.2"/>
    <text x="418" y="118" class="lab" font-size="22">备素材</text>
    <text x="418" y="143" class="sub" font-size="14">抠图 图库 体检</text>

    <text x="584" y="72" class="num" font-size="15">04</text>
    <rect x="522" y="86" width="124" height="72" rx="10" class="box" stroke-width="1.2"/>
    <text x="584" y="118" class="lab" font-size="22">写图</text>
    <text x="584" y="143" class="sub" font-size="14">固定画布 HTML</text>

    <text x="750" y="72" class="num" font-size="15">05</text>
    <rect x="688" y="86" width="124" height="72" rx="10" class="box hot" stroke-width="1.8"/>
    <text x="750" y="118" class="lab" font-size="22">导出</text>
    <text x="750" y="143" class="sub hotlab" font-size="14">Kiln 九格式</text>

    <text x="916" y="72" class="num" font-size="15">06</text>
    <rect x="854" y="86" width="124" height="72" rx="10" class="box" stroke-width="1.2"/>
    <text x="916" y="118" class="lab" font-size="22">自检</text>
    <text x="916" y="143" class="sub" font-size="14">机检 加 看图</text>

    <text x="1082" y="72" class="num" font-size="15">07</text>
    <rect x="1020" y="86" width="124" height="72" rx="10" class="box" stroke-width="1.2"/>
    <text x="1082" y="118" class="lab" font-size="22">交付</text>
    <text x="1082" y="143" class="sub" font-size="14">路径 尺寸 版权</text>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#8c959f" stroke-width="1.4" fill="none">
    <line x1="148"  y1="122" x2="182"  y2="122"/>
    <line x1="314"  y1="122" x2="348"  y2="122"/>
    <line x1="480"  y1="122" x2="514"  y2="122"/>
    <line x1="646"  y1="122" x2="680"  y2="122"/>
    <line x1="812"  y1="122" x2="846"  y2="122"/>
    <line x1="978"  y1="122" x2="1012" y2="122"/>
  </g>
  <g fill="#8c959f">
    <path d="M190 122 l-9 -5 v10 z"/>
    <path d="M356 122 l-9 -5 v10 z"/>
    <path d="M522 122 l-9 -5 v10 z"/>
    <path d="M688 122 l-9 -5 v10 z"/>
    <path d="M854 122 l-9 -5 v10 z"/>
    <path d="M1020 122 l-9 -5 v10 z"/>
  </g>

  <!-- 改稿回路:06 → 04 -->
  <path d="M916 158 V196 H584 V166" stroke="#8c959f" stroke-width="1.4" fill="none" stroke-dasharray="5 5"/>
  <path d="M584 166 l-5 9 h10 z" fill="#8c959f"/>
  <text x="750" y="216" class="sub" text-anchor="middle"
        font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace,"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif" font-size="15">改稿:定点改 HTML,不重跑全图</text>
</svg>
