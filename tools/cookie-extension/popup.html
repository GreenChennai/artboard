<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { --bg:#14121f; --card:#1e1b2e; --ink:#f2eeff; --muted:#8f89a8; --accent:#2ee6a8; }
  * { box-sizing:border-box; margin:0; }
  body { width:340px; background:var(--bg); color:var(--ink);
         font:14px/1.6 "Microsoft YaHei UI", "Segoe UI", sans-serif; padding:16px; }
  h1 { font-size:15px; letter-spacing:.06em; display:flex; align-items:center; gap:8px; }
  h1 .dot { width:9px; height:9px; border-radius:50%; background:var(--accent);
            box-shadow:0 0 10px var(--accent); }
  .site { margin-top:12px; padding:10px 12px; background:var(--card); border-radius:10px;
          border:1px solid rgba(255,255,255,.08); font-size:13px; }
  .site b { color:var(--accent); }
  .site .bad { color:#e05a6a; }
  button { margin-top:12px; width:100%; padding:11px 0; border:0; border-radius:10px;
           background:var(--accent); color:#101a2e; font:700 14px/1 inherit; cursor:pointer; }
  button:disabled { background:#3a3750; color:var(--muted); cursor:not-allowed; }
  textarea { margin-top:12px; width:100%; height:96px; background:var(--card); color:var(--ink);
             border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px;
             font:11px/1.5 Consolas, monospace; resize:none; display:none; }
  .tip { margin-top:10px; font-size:11.5px; color:var(--muted); }
  .ok { color:var(--accent); }
</style>
</head>
<body>
  <h1><span class="dot"></span>artboard Cookie 助手</h1>
  <div class="site" id="site">正在读取当前标签页…</div>
  <button id="grab" disabled>抓取本站 Cookie → 复制 config 片段</button>
  <textarea id="out" readonly></textarea>
  <div class="tip" id="tip">
    支持花瓣 huaban.com / 图标库 iconfont.cn / Pinterest。先在浏览器登录对应站点,
    再打开本插件抓取,把片段粘贴进 artboard 的 <b>config.json</b>。
    Cookie 只在本机复制,不做任何上传。
  </div>
  <script src="popup.js"></script>
</body>
</html>
