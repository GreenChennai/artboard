<!DOCTYPE html>

<style>
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');

@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }

* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:2362px; height:5906px; overflow:hidden; background:#241a10; }

.brand { position:absolute; top:480px; left:0; right:0; text-align:center; }
.brand .mark { width:200px; height:200px; margin:0 auto; border-radius:50%;

  background:rgba(36,26,16,.55); }
.brand .name { margin-top:56px; font:700 140px/1 'MiSans'; color:var(--c-cream);

.brand .en { margin-top:32px; font:400 42px/1 'MiSans'; color:var(--c-gold); letter-spacing:.52em; text-indent:.52em;

.body { position:absolute; top:2500px; left:240px; right:240px; text-align:center; }

.h1 .gold { color:var(--c-gold); }
.sub { margin-top:60px; font:400 84px/1.6 'MiSans'; color:var(--c-muted); letter-spacing:.12em; }

.points { margin-top:150px; display:flex; flex-direction:column; text-align:left; }
.point { display:flex; gap:64px; align-items:flex-start;
  padding:78px 40px; border-bottom:3px solid rgba(217,166,72,.28); }
.point:first-child { border-top:3px solid rgba(217,166,72,.28); }
.point .no { font:400 120px/1 'SmileySans'; color:var(--c-gold); min-width:160px; }
.point h3 { font:700 92px/1.25 'MiSans'; color:var(--c-cream); }
.point p { margin-top:24px; font:400 66px/1.6 'MiSans'; color:var(--c-muted); }

.foot { position:absolute; left:240px; right:240px; bottom:680px; text-align:center; }
.qr { width:480px; height:480px; margin:0 auto; background:var(--c-cream); border-radius:32px;

.qr img { width:86%; height:86%; }
.foot .cta { margin-top:70px; font:700 116px/1 'MiSans'; color:var(--c-gold); letter-spacing:.1em; }

<body><div class="poster">

    <img src="img/brand-coffee-pexels-02.jpg" alt="">
