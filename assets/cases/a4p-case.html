<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>a4p-case · 秋日咖啡品鉴会(A4 海报,满版)</title>
<!-- 素材:materials/promo-coffee-clean/promo-coffee-clean-pexels-02.jpg(Pexels License / Lood Goosen)
     A4 品类规范见 references/formats/a4p.md:1240×1754,scale 2 = 300dpi
     字体:MiSans + 得意黑;满版照片上 52%,下 48% 米色信息区 -->
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');
  font-weight:normal; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1240px; height:1754px; overflow:hidden; background:#f7f1e6; }
:root { --c-ink:#241a10; --c-brown:#6d4326; --c-gold:#b98a2e; --c-amber:#d98e3a; --c-muted:#8a7a62; }

/* 上 52%:满版照片,底部渐入米色 */
.hero { position:absolute; top:0; left:0; right:0; height:920px; overflow:hidden; }
.hero img { width:100%; height:100%; object-fit:cover; object-position:center 32%; }
.hero .fade { position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(36,26,16,.34) 0%, rgba(36,26,16,0) 26%, rgba(36,26,16,.86) 94%, #f7f1e6 100%); }
.kicker { position:absolute; top:88px; left:0; right:0; text-align:center;
  font:600 27px/1 'MiSans'; color:#f2e6cf; letter-spacing:.6em; text-indent:.6em;
  text-shadow:0 2px 10px rgba(0,0,0,.5); }
.title { position:absolute; top:636px; left:0; right:0; text-align:center;
  font:700 108px/1.1 'MiSans'; color:#fff8ec; letter-spacing:.1em;
  text-shadow:0 6px 26px rgba(0,0,0,.55); }
.title .accent { color:var(--c-amber); }

/* 下 48%:信息区 */
.sub { position:absolute; top:992px; left:0; right:0; text-align:center;
  font:400 31px/1.7 'MiSans'; color:var(--c-brown); }

.info { position:absolute; top:1120px; left:120px; right:120px;
  display:flex; border-top:3px solid var(--c-ink); border-bottom:1px solid rgba(36,26,16,.22); }
.info .cell { flex:1; padding:36px 8px 32px; text-align:center; }
.info .cell + .cell { border-left:1px solid rgba(36,26,16,.16); }
.info .k { font:400 23px/1 'MiSans'; color:var(--c-muted); letter-spacing:.42em; text-indent:.42em; }
.info .v { margin-top:18px; font:700 36px/1.4 'MiSans'; color:var(--c-ink); }
.info .v small { font:400 24px/1.4 'MiSans'; color:var(--c-brown); }

.list { position:absolute; top:1370px; left:150px; right:150px; }
.list .row { display:flex; align-items:flex-start; gap:22px; padding:12px 0; }
.list .dot { width:11px; height:11px; border-radius:50%; background:var(--c-amber); margin-top:19px; flex:none; }
.list p { font:400 29px/1.7 'MiSans'; color:var(--c-ink); }
.list p b { font-weight:700; color:var(--c-brown); }

.cta { position:absolute; bottom:88px; left:120px; right:120px; text-align:center;
  background:var(--c-ink); color:#f7f1e6; padding:34px 0; border-radius:14px;
  font:600 33px/1 'MiSans'; letter-spacing:.1em; }
.cta b { color:var(--c-amber); }
.foot { position:absolute; bottom:36px; left:0; right:0; text-align:center;
  font:400 21px/1 'MiSans'; color:var(--c-muted); letter-spacing:.2em; }
</style></head>
<body><div class="poster">
  <div class="hero">
    <img src="img/promo-coffee-clean-pexels-02.jpg" alt="">
    <div class="fade"></div>
    <div class="kicker">山雾茶町 · 秋季限定</div>
    <div class="title">秋日咖啡<span class="accent">品鉴会</span></div>
  </div>

  <div class="sub">六款产地豆 · 手冲与奶咖双线品鉴 · 主理人带你喝懂一杯</div>

  <div class="info">
    <div class="cell"><div class="k">时间</div><div class="v">10.21 <small>周六</small></div></div>
    <div class="cell"><div class="k">地点</div><div class="v">山雾茶町 <small>二号店</small></div></div>
    <div class="cell"><div class="k">席位</div><div class="v">限 16 席</div></div>
    <div class="cell"><div class="k">费用</div><div class="v">¥88 <small>/ 位</small></div></div>
  </div>

  <div class="list">
    <div class="row"><span class="dot"></span><p><b>14:00</b> 产地豆故事:从海拔到杯型的三段风味</p></div>
    <div class="row"><span class="dot"></span><p><b>15:00</b> 手冲工坊 + 金沫冲演示,亲手冲一杯自己的豆</p></div>
  </div>

  <div class="cta">预约席位 · 到店出示本海报立减 <b>¥10</b></div>
  <div class="foot">SHANWU TEATOWN · 杭州市西湖区雾山路 88 号</div>
</div></body></html>
