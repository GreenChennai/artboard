<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>trifold-case · 山雾茶町三折页(正面:内页一/二/三)</title>
<!-- 素材:materials/brand-coffee(Pexels License)。三折页规范见 references/formats/trifold.md
     折线 x=585/1169;文字禁跨折线;包心折栏位映射见规范。字体:MiSans -->
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');
  font-weight:normal; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1754px; height:1240px; overflow:hidden; background:#faf6ef; }
:root { --c-ink:#241a10; --c-brown:#6d4326; --c-gold:#b98a2e; --c-amber:#e0a458; --c-muted:#8a7a62; }

/* 内页一:照片 + 引言 */
.c1 { position:absolute; left:0; top:0; bottom:0; width:585px; overflow:hidden; background:#181109; }
.c1 img { width:100%; height:100%; object-fit:cover; object-position:center 45%;
  filter:brightness(.68) saturate(.95); }
.c1 .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(24,17,9,.2), rgba(24,17,9,.66)); }
.c1 .quote { position:absolute; left:56px; right:56px; bottom:88px;
  font:700 40px/1.75 'MiSans'; color:#f2e6cf; }
.c1 .quote small { display:block; margin-top:26px; font:400 24px/1 'MiSans';
  color:#c9b389; letter-spacing:.3em; }

/* 内页二:主张 + 三条理念 */
.c2 { position:absolute; left:585px; top:0; bottom:0; width:584px; background:#fff;
  padding:96px 64px; }
.c2 .kicker { font:600 24px/1 'MiSans'; color:var(--c-gold); letter-spacing:.4em; }
.c2 h2 { margin-top:26px; font:700 58px/1.3 'MiSans'; color:var(--c-ink); }
.c2 .lead { margin-top:30px; font:400 27px/1.85 'MiSans'; color:var(--c-muted); }
.item { margin-top:52px; display:flex; gap:26px; }
.item .dot { width:52px; height:52px; flex:none; border-radius:50%; background:var(--c-amber);
  color:#fff; display:flex; align-items:center; justify-content:center; font:600 26px/1 'MiSans'; }
.item h3 { font:600 33px/1.3 'MiSans'; color:var(--c-ink); }
.item p { margin-top:10px; font:400 25px/1.7 'MiSans'; color:var(--c-muted); }

/* 内页三(折口):豆单 */
.c3 { position:absolute; left:1169px; top:0; bottom:0; width:585px; padding:96px 60px;
  background:#f2e8d8; }
.c3 .kicker { font:600 24px/1 'MiSans'; color:var(--c-gold); letter-spacing:.4em; }
.c3 h2 { margin-top:26px; font:700 54px/1.3 'MiSans'; color:var(--c-ink); }
.bean { margin-top:56px; padding-bottom:44px; border-bottom:2px dotted rgba(36,26,16,.22); }
.bean .row { display:flex; justify-content:space-between; align-items:baseline; }
.bean h3 { font:600 34px/1.3 'MiSans'; color:var(--c-ink); }
.bean .origin { font:600 24px/1 'MiSans'; color:var(--c-amber); }
.bean p { margin-top:14px; font:400 25px/1.65 'MiSans'; color:var(--c-muted); }
</style></head>
<body><div class="poster">
  <div class="c1">
    <img src="img/brand-coffee-pexels-01.jpg" alt="">
    <div class="veil"></div>
    <div class="quote">「山雾之间,<br>一杯日常。」
      <small>山雾茶町 · 主理人手记</small></div>
  </div>
  <div class="c2">
    <div class="kicker">OUR WAY</div>
    <h2>我们怎么做<br>一杯咖啡</h2>
    <div class="lead">不追风口,不讲故事。把三件小事做稳,咖啡自己会说话。</div>
    <div class="item"><span class="dot">一</span>
      <div><h3>两周内的新豆</h3><p>烘焙日期上墙,超过两周的下架转手冲。</p></div></div>
    <div class="item"><span class="dot">二</span>
      <div><h3>每人每杯研磨</h3><p>点单后现磨,参数按当日湿度微调。</p></div></div>
    <div class="item"><span class="dot">三</span>
      <div><h3>先尝后加奶</h3><p>奶咖先给你尝一口原液,再决定浓淡。</p></div></div>
  </div>
  <div class="c3">
    <div class="kicker">BEAN LIST</div>
    <h2>本季豆单</h2>
    <div class="bean"><div class="row"><h3>雾谷 水洗</h3><span class="origin">埃塞俄比亚</span></div>
      <p>茉莉花 · 柑橘 · 红茶尾韵,手冲首选。</p></div>
    <div class="bean"><div class="row"><h3>山雾 拼配</h3><span class="origin">巴西 + 曼特宁</span></div>
      <p>黑巧 · 焦糖 · 厚实body,奶咖不占地。</p></div>
    <div class="bean"><div class="row"><h3>夜露 日晒</h3><span class="origin">云南 保山</span></div>
      <p>莓果 · 酒酿 · 甜感明亮,本季限定。</p></div>
  </div>
</div></body></html>
