<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-rollup · 青梧智联校招</title>
<style>
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');
  font-weight:normal; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:2362px; height:5906px; overflow:hidden; background:#081410; }
:root { --c-ink:#eef7f0; --c-teal:#2ee6a8; --c-muted:#6f8a7c; }
.mesh { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(55% 26% at 50% 12%, rgba(46,230,168,.30) 0%, transparent 62%); }
.grid { position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(rgba(238,247,240,.05) 1px, transparent 1px) 0 0/ 118px 118px,
    linear-gradient(90deg, rgba(238,247,240,.05) 1px, transparent 1px) 0 0/ 118px 118px;
  -webkit-mask-image:radial-gradient(80% 45% at 50% 25%, #000 30%, transparent 100%); }
.wrap { position:absolute; inset:0; padding:560px 300px; text-align:center; }
.logo { font:600 92px/1 'MiSans'; color:var(--c-muted); letter-spacing:.42em; text-indent:.42em; }
.version { margin-top:110px; display:inline-flex; padding:24px 60px; border-radius:999px;
  background:rgba(46,230,168,.10); border:2px solid rgba(46,230,168,.45);
  box-shadow:0 0 40px rgba(46,230,168,.16); }
.version span { font:600 56px/1 'MiSans'; color:var(--c-teal); letter-spacing:.22em; }
h1 { margin-top:150px; font:400 420px/1.05 'SmileySans'; color:var(--c-ink); letter-spacing:.04em; }
h1 .gold { color:var(--c-teal); }
.sub { margin-top:80px; font:400 110px/1.5 'MiSans'; color:var(--c-muted); letter-spacing:.1em; }
.jobs { margin-top:230px; display:flex; flex-direction:column; text-align:left; }
.job { display:flex; gap:70px; align-items:baseline; padding:90px 60px;
  border-bottom:3px solid rgba(46,230,168,.25); }
.job:first-child { border-top:3px solid rgba(46,230,168,.25); }
.job .city { font:400 80px/1 'SmileySans'; color:var(--c-teal); min-width:220px; }
.job h3 { font:700 100px/1.2 'MiSans'; color:var(--c-ink); }
.job p { margin-top:22px; font:400 64px/1.5 'MiSans'; color:var(--c-muted); }
.foot { position:absolute; left:300px; right:300px; bottom:640px; text-align:center; }
.foot .qr { width:520px; height:520px; margin:0 auto; background:var(--c-ink); border-radius:28px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.foot .cta { margin-top:80px; font:700 124px/1 'MiSans'; color:var(--c-teal); letter-spacing:.1em; }
.foot .meta { margin-top:46px; font:400 64px/1.7 'MiSans'; color:var(--c-muted); }
</style></head>
<body><div class="poster">
  <div class="mesh"></div><div class="grid"></div>
  <div class="wrap">
    <div class="logo">青梧智联 GREENPARASOL</div>
    <div class="version"><span>2026 校园招聘</span></div>
    <h1>把世界<br><span class="gold">连起来</span></h1>
    <div class="sub">IoT 平台工程师 · 嵌入式 · 产品经纬</div>
    <div class="jobs">
      <div class="job"><span class="city">杭州</span>
        <div><h3>平台研发工程师</h3><p>设备接入与规则引擎 · 本硕计算机相关</p></div></div>
      <div class="job"><span class="city">深圳</span>
        <div><h3>嵌入式开发</h3><p>RTOS / LoRa / 边缘网关方向</p></div></div>
      <div class="job"><span class="city">远程</span>
        <div><h3>产品经纬(实习)</h3><p>一周三天到岗,导师一对一带教</p></div></div>
    </div>
  </div>
  <div class="foot">
    <div class="qr"><img src="img/qr.png" alt=""></div>
    <div class="cta">投递通道 · 简历直达用人经理</div>
    <div class="meta">campus@greenparasol.io · 城市峰会 10.16 见</div>
  </div>
</div></body></html>
