<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-trifold-back · 半山云宿三折页(背面)</title>
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
@font-face { font-family:'LxgwWenKai'; src:url('fonts/LXGWWenKai-Regular.ttf') format('truetype');
  font-weight:normal; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1754px; height:1240px; overflow:hidden; }
:root { --c-ink:#22303a; --c-teal:#3d6b64; --c-wood:#b98a5e; --c-muted:#71817c; }
.c1 { position:absolute; left:0; top:0; bottom:0; width:585px; background:#fff; padding:96px 60px; }
.c1 .kicker { font:600 24px/1 'MiSans'; color:var(--c-teal); letter-spacing:.4em; }
.c1 h2 { margin-top:26px; font:700 52px/1.3 'MiSans'; color:var(--c-ink); }
.day { margin-top:48px; display:flex; gap:24px; }
.day .t { font:600 30px/1 'MiSans'; color:var(--c-wood); min-width:120px; }
.day h3 { font:600 30px/1.4 'MiSans'; color:var(--c-ink); }
.day p { margin-top:8px; font:400 24px/1.6 'MiSans'; color:var(--c-muted); }
.c2 { position:absolute; left:585px; top:0; bottom:0; width:584px; background:#22303a;
  color:#eef4f0; padding:96px 64px; }
.c2 .kicker { font:600 24px/1 'MiSans'; color:#a9c0b6; letter-spacing:.4em; }
.c2 .qr { margin-top:56px; width:300px; height:300px; background:#eef4f0; border-radius:16px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; }
.c2 .qr img { width:88%; height:88%; }
.c2 .addr { margin-top:60px; font:400 28px/2.0 'MiSans'; color:#a9c0b6; }
.c2 .addr b { font-weight:600; color:#eef4f0; }
.c2 .addr .nowrap { white-space:nowrap; }
.c3 { position:absolute; left:1169px; top:0; bottom:0; width:585px; overflow:hidden; background:#22303a; }
.c3 img { width:100%; height:100%; object-fit:cover; object-position:center 30%;
  filter:brightness(.62) saturate(.85); }
.c3 .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(34,48,58,.4), rgba(34,48,58,.2) 45%, rgba(34,48,58,.8)); }
.c3 .brand { position:absolute; left:0; right:0; bottom:0; padding:0 56px 96px; }
.c3 .mark { width:104px; height:104px; border-radius:50%; border:2px solid var(--c-wood);
  color:var(--c-wood); display:flex; align-items:center; justify-content:center;
  font:600 44px/1 'MiSans'; }
.c3 .name { margin-top:38px; font:700 82px/1.2 'MiSans'; color:#eef4f0; letter-spacing:.16em; }
.c3 .slogan { margin-top:22px; font:26px/1.7 'LxgwWenKai'; color:#a9c0b6; letter-spacing:.12em; }
</style></head>
<body><div class="poster">
  <div class="c1">
    <div class="kicker">ONE DAY</div>
    <h2>住在半山的<br>二十四小时</h2>
    <div class="day"><span class="t">07:30</span>
      <div><h3>被鸟叫和咖啡香叫醒</h3><p>早餐送到房间门口的木盒里。</p></div></div>
    <div class="day"><span class="t">15:00</span>
      <div><h3>堂屋围炉喝茶</h3><p>主理人聊山里的四季与路线。</p></div></div>
    <div class="day"><span class="t">21:00</span>
      <div><h3>露台观星</h3><p>关掉所有灯,让银河自己亮起来。</p></div></div>
  </div>
  <div class="c2">
    <div class="kicker">BOOK NOW</div>
    <div class="qr"><img src="img/qr.png" alt=""></div>
    <div class="addr">
      <b>半山云宿 · 山脊店</b><br>
      杭州市西湖区云栖坞 6 号<br>
      常年可订 09:00 – 22:00<br>
      <span class="nowrap">stay@banshan.cloud · 139 0000 0000</span>
    </div>
  </div>
  <div class="c3">
    <img src="img/promo-coffee-land-pexels-01.jpg" alt="">
    <div class="veil"></div>
    <div class="brand">
      <div class="mark">云</div>
      <div class="name">半山云宿</div>
      <div class="slogan">把日子过慢一点</div>
    </div>
  </div>
</div></body></html>
