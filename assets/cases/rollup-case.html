<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>rollup-case · 山雾茶町会员招募(易拉宝)</title>

<style>
@font-face { font-family:'SmileySans'; src:url('fonts/SmileySans-Oblique.ttf') format('truetype');
  font-weight:normal; font-display:block; }
@font-face { font-family:'SourceHanSans'; src:url('fonts/NotoSansSC-VF.ttf') format('truetype');
  font-weight:100 900; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:2362px; height:5906px; overflow:hidden; background:#241a10; }
:root { --c-ink:#fdf6ea; --c-cream:#f2e6cf; --c-gold:#d9a648; --c-amber:#e0a458; --c-muted:#b39b74; }

.hero { position:absolute; top:0; left:0; right:0; height:2160px; overflow:hidden; }
.hero img { width:100%; height:100%; object-fit:cover; object-position:center 42%;

.hero .fade { position:absolute; inset:0;

.brand { position:absolute; top:460px; left:0; right:0; text-align:center; }
.brand .mark { width:190px; height:190px; margin:0 auto; border-radius:50%;
  border:3px solid var(--c-gold); color:var(--c-gold);

  background:rgba(36,26,16,.55); }
.brand .name { margin-top:50px; font:900 128px/1 'SourceHanSans'; color:var(--c-cream);

.brand .en { margin-top:30px; font:600 38px/1 'SourceHanSans'; color:var(--c-gold); letter-spacing:.52em; text-indent:.52em; }

.body { position:absolute; top:2360px; left:240px; right:240px; text-align:center; }
.h1 { font:400 250px/1.1 'SmileySans'; color:var(--c-cream); letter-spacing:.04em; }
.h1 .gold { color:var(--c-gold); }
.sub { margin-top:56px; font:300 80px/1.6 'SourceHanSans'; color:var(--c-muted); letter-spacing:.12em; }

.points { margin-top:150px; display:flex; flex-direction:column; gap:90px; text-align:left; }
.point { display:flex; gap:60px; align-items:flex-start;
  background:rgba(253,246,234,.05); border:2px solid rgba(217,166,72,.35);
  border-radius:24px; padding:64px 84px; }
.point .no { font:400 110px/1 'SmileySans'; color:var(--c-gold); min-width:150px; }
.point h3 { font:800 86px/1.25 'SourceHanSans'; color:var(--c-cream); }
.point p { margin-top:22px; font:300 64px/1.6 'SourceHanSans'; color:var(--c-muted); }

.qr { width:470px; height:470px; margin:0 auto; background:var(--c-cream); border-radius:32px;

.foot .cta { margin-top:64px; font:800 104px/1 'SourceHanSans'; color:var(--c-gold); letter-spacing:.1em; }

<body><div class="poster">
  <div class="hero">
    <img src="img/brand-coffee-pexels-02.jpg" alt="">
    <div class="fade"></div>
