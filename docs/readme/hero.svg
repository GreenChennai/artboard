<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">artboard · HTML 海报工作室</title>
  <desc id="d">字落生根,版上开花:用 HTML/CSS 把文案与照片养成印刷级设计图,导出 PNG/GIF/MP4/PDF,并可逆转换矢量工程文件。</desc>

  <defs>
