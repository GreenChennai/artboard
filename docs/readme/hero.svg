<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">artboard · HTML 海报工作室</title>
  <desc id="d">字落生根,版上开花:用 HTML/CSS 把文案与照片养成印刷级设计图,导出 PNG/GIF/MP4/PDF。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fcf0"/><stop offset="1" stop-color="#e9f4d6"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffd23e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>

  <!-- 环境:柔光晕 + 飘散的种子 -->
  <circle cx="958" cy="246" r="178" fill="#def0bd" opacity=".55"/>
  <g fill="#b9dc83">
    <circle cx="1148" cy="56" r="3"/><circle cx="1172" cy="82" r="2.5"/>
  </g>

  <!-- 裁切标记(印刷出血 motif) -->
  <g stroke="#93bd58" stroke-width="2" opacity=".9" fill="none">
    <path d="M34 10v24M10 34h24"/><path d="M1166 10v24M1190 34h-24"/>
    <path d="M34 430v-24M10 406h24"/><path d="M1166 430v-24M1190 406h-24"/>
  </g>

  <!-- 左栏:标题区 -->
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="64" y="76" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="17" letter-spacing="4.5" fill="#55891f">AGENT SKILL · HTML 海报工作室</text>

    <rect x="64" y="168" width="372" height="18" rx="9" fill="#ffe36e" opacity=".7" transform="rotate(-.5 250 177)"/>
    <text x="62" y="172" font-size="86" font-weight="800" letter-spacing="-.5" fill="#22380f">artboard</text>

    <text x="64" y="246" font-family="KaiTi,'Kaiti SC','STKaiti','BiauKai',serif" font-size="36" fill="#2b4a13">「字落生根,版上开花。」</text>
    <text x="64" y="290" font-size="19" fill="#57703c">把每一句文案、每一张照片,养成印刷级的设计图。</text>

    <g font-size="17" fill="#6f8452">
      <text x="64" y="330">小红书封面 · 电商主图 · 主 KV · 数据长图</text>
      <text x="64" y="359">名片 · 三折页 · 易拉宝 · PPT 页 · GIF 动图</text>
    </g>

    <g font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="16.5" fill="#47711f" text-anchor="middle">
      <rect x="64" y="384" width="206" height="40" rx="20" fill="#fdfff5" fill-opacity=".55" stroke="#7fae44" stroke-width="1.6"/>
      <text x="167" y="410">PNG·GIF·MP4·PDF</text>
      <rect x="286" y="384" width="154" height="40" rx="20" fill="#fdfff5" fill-opacity=".55" stroke="#7fae44" stroke-width="1.6"/>
      <text x="363" y="410">145 风格方向</text>
      <rect x="456" y="384" width="146" height="40" rx="20" fill="#fdfff5" fill-opacity=".55" stroke="#7fae44" stroke-width="1.6"/>
      <text x="529" y="410">10 画布预设</text>
    </g>
  </g>

  <!-- 右侧:画布上长出嫩芽(字落生根的视觉呼应) -->
  <g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
    <g stroke="#96c05c" stroke-width="1.6" fill="none">
      <path d="M778 64h16M786 56v16"/><path d="M1112 64h16M1120 56v16"/>
      <path d="M778 376h16M786 368v16"/><path d="M1112 376h16M1120 368v16"/>
    </g>

    <rect x="812" y="94" width="320" height="284" rx="16" fill="#4e7526" opacity=".16"/>
    <rect x="800" y="78" width="320" height="284" rx="16" fill="#fdfff6" stroke="#abd077" stroke-width="1.5"/>

    <circle cx="1052" cy="146" r="46" fill="none" stroke="#f5cf3f" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" opacity=".75"/>
    <circle cx="1052" cy="146" r="33" fill="url(#sun)"/>

    <rect x="832" y="112" width="158" height="22" rx="5" fill="#2b4a12"/>
    <rect x="832" y="148" width="112" height="14" rx="4" fill="#7ba33f"/>

    <rect x="832" y="198" width="256" height="12" rx="6" fill="#aecb84"/>
    <rect x="832" y="224" width="210" height="12" rx="6" fill="#aecb84"/>
    <rect x="832" y="250" width="236" height="12" rx="6" fill="#aecb84"/>

    <!-- 文字行末长出的新芽 -->
    <path d="M1042 230C1042 210 1048 202 1062 195" stroke="#4c8418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <g transform="translate(1062 195)">
      <path d="M0 0C-2 -12 4 -20 15 -24C18 -12 12 -3 0 0Z" fill="#7cbf2e"/>
      <path d="M2 1C12 -5 21 -5 28 0C21 7 11 7 2 1Z" fill="#a8da52"/>
    </g>

    <rect x="832" y="292" width="136" height="38" rx="19" fill="#2b4a12"/>
    <rect x="852" y="307" width="70" height="9" rx="4.5" fill="#d9edb4"/>
    <circle cx="944" cy="311" r="7" fill="url(#sun)"/>
  </g>

  <!-- 飘落的叶 -->
  <g transform="translate(744 42) rotate(-28)">
    <path d="M0 0C-2 -12 5 -21 16 -25C19 -13 12 -3 0 0Z" fill="#9ccb43"/>
  </g>
  <g transform="translate(1148 352) rotate(118)">
    <path d="M0 0C-2 -12 5 -21 16 -25C19 -13 12 -3 0 0Z" fill="#c6e390"/>
  </g>
</svg>
