<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>show2-trifold · 半山云宿三折页(正面)</title>
<!-- 素材:materials/show2-stay(Pexels License)。折线 x=585/1169;雾蓝+暖木 -->
<style>
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Semibold.ttf') format('truetype'); font-weight:600; font-display:block; }
@font-face { font-family:'MiSans'; src:url('fonts/MiSans-Bold.ttf') format('truetype'); font-weight:700; font-display:block; }
@font-face { font-family:'LxgwWenKai'; src:url('fonts/LXGWWenKai-Regular.ttf') format('truetype');
  font-weight:normal; font-display:block; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { margin:0; background:#fff; }
.poster { position:relative; width:1754px; height:1240px; overflow:hidden; background:#eef1ee; }
:root { --c-ink:#22303a; --c-teal:#3d6b64; --c-wood:#b98a5e; --c-muted:#71817c; }
.c1 { position:absolute; left:0; top:0; bottom:0; width:585px; overflow:hidden; background:#22303a; }
.c1 img { width:100%; height:100%; object-fit:cover; object-position:center 40%;
  filter:brightness(.7) saturate(.85); }
.c1 .veil { position:absolute; inset:0; background:linear-gradient(180deg, rgba(34,48,58,.22), rgba(34,48,58,.62)); }
.c1 .quote { position:absolute; left:56px; right:56px; bottom:88px;
  font:400 42px/1.8 'LxgwWenKai'; color:#eef4f0; }
.c1 .quote small { display:block; margin-top:26px; font:400 24px/1 'MiSans'; color:#a9c0b6; letter-spacing:.3em; }
.c2 { position:absolute; left:585px; top:0; bottom:0; width:584px; background:#fff; padding:96px 64px; }
.c2 .kicker { font:600 24px/1 'MiSans'; color:var(--c-teal); letter-spacing:.4em; }
.c2 h2 { margin-top:26px; font:700 54px/1.35 'MiSans'; color:var(--c-ink); }
.c2 .lead { margin-top:28px; font:400 26px/1.85 'MiSans'; color:var(--c-muted); }
.room { margin-top:50px; display:flex; gap:24px; align-items:flex-start; }
.room .ic { width:50px; height:50px; flex:none; border-radius:12px; background:var(--c-teal);
  color:#fff; display:flex; align-items:center; justify-content:center; font:600 24px/1 'MiSans'; }
.room h3 { font:600 31px/1.3 'MiSans'; color:var(--c-ink); }
.room p { margin-top:8px; font:400 24px/1.65 'MiSans'; color:var(--c-muted); }
.c3 { position:absolute; left:1169px; top:0; bottom:0; width:585px; padding:96px 60px;
  background:#e4ebe4; }
.c3 .kicker { font:600 24px/1 'MiSans'; color:var(--c-teal); letter-spacing:.4em; }
.c3 h2 { margin-top:26px; font:700 52px/1.3 'MiSans'; color:var(--c-ink); }
.plan { margin-top:48px; padding-bottom:42px; border-bottom:2px dotted rgba(34,48,58,.2); }
.plan .row { display:flex; justify-content:space-between; align-items:baseline; }
.plan h3 { font:600 32px/1.3 'MiSans'; color:var(--c-ink); }
.plan .tag { font:600 23px/1 'MiSans'; color:var(--c-wood); }
.plan p { margin-top:12px; font:400 24px/1.65 'MiSans'; color:var(--c-muted); }
</style></head>
<body><div class="poster">
  <div class="c1">
    <img src="img/stay.jpg" alt="">
    <div class="veil"></div>
    <div class="quote">「把日子过慢一点,<br>山知道答案。」
      <small>半山云宿 · 主理人</small></div>
  </div>
  <div class="c2">
    <div class="kicker">THE STAY</div>
    <h2>十二间房,<br>十二面山</h2>
    <div class="lead">每间房只做一件事:把你留在窗前。全屋地暖、零电视,山景是最好的节目。</div>
    <div class="room"><span class="ic">早</span>
      <div><h3>山房早餐</h3><p>在地食材现做,七点起随到随吃。</p></div></div>
    <div class="room"><span class="ic">茶</span>
      <div><h3>围炉茶歇</h3><p>下午三点,堂屋炭炉与高山茶常开。</p></div></div>
    <div class="room"><span class="ic">夜</span>
      <div><h3>观星露台</h3><p>无光害山脊,望远镜与毯子备好。</p></div></div>
  </div>
  <div class="c3">
    <div class="kicker">PLANS</div>
    <h2>两种住法</h2>
    <div class="plan"><div class="row"><h3>云宿套房</h3><span class="tag">含双早</span></div>
      <p>58㎡ 独立山景浴缸,适合两个人发呆。</p></div>
    <div class="plan"><div class="row"><h3>山居小院</h3><span class="tag">可住四口</span></div>
      <p>上下两层小院,带私汤与一棵桂花树。</p></div>
  </div>
</div></body></html>
